<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>React Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #121212;
            color: white;
        }
        .search-container {
            max-width: 600px;
            margin: auto;
        }
        .card {
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <section class="py-5 text-center container">
        <div class="row py-lg-5">
            <div class="col-lg-8 col-md-10 mx-auto">
                <h1 class="fw-bold">React Projects</h1>
                <p class="lead">Browse and explore React JS projects.</p>
                <form class="d-flex search-container" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search projects..." aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </section>
    
    <!-- Projects Section -->
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
            <div class="col">
                <div class="card shadow-lg bg-dark text-light">
                    <a href=" https://all-scientific-tech.netlify.app/">
                        <img class="card-img-top" src="https://all-scientific-tech.netlify.app/assets/images/header/all-logo.avif" alt="Testcases on whiteboard">
                    </a>
                    <div class="card-body text-center">
                        <h3 class="card-title">All Scientific Tech</h3>
                        <p class="card-text">All Scientific Tech website using react js.</p>
                        <a href=" https://all-scientific-tech.netlify.app/" class="btn btn-outline-light">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
